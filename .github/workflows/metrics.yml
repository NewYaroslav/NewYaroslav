name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const fs = require("fs");
            const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" })[char]);
            const formatNumber = new Intl.NumberFormat("en-US");
            const query = `
              query($login: String!, $cursor: String) {
                user(login: $login) {
                  followers { totalCount }
                  repositories(first: 100, after: $cursor, isFork: false, orderBy: {field: UPDATED_AT, direction: DESC}) {
                    totalCount
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      stargazers { totalCount }
                      forkCount
                      watchers { totalCount }
                      languages(first: 8) {
                        edges { size node { name color } }
                      }
                    }
                  }
                }
              }`;
            let cursor = null;
            let totalRepositories = 0;
            let followers = 0;
            let stars = 0;
            let forks = 0;
            let watchers = 0;
            const languages = new Map();
            do {
              const { user } = await github.graphql(query, { login: "LimiNode", cursor });
              const repositories = user.repositories;
              totalRepositories = repositories.totalCount;
              followers = user.followers.totalCount;
              for (const repository of repositories.nodes) {
                stars += repository.stargazers.totalCount;
                forks += repository.forkCount;
                watchers += repository.watchers.totalCount;
                for (const { size, node } of repository.languages.edges) {
                  const language = languages.get(node.name) ?? { size: 0, color: node.color ?? "#8b949e" };
                  language.size += size;
                  languages.set(node.name, language);
                }
              }
              cursor = repositories.pageInfo.hasNextPage ? repositories.pageInfo.endCursor : null;
            } while (cursor);
            const topLanguages = [...languages.entries()]
              .sort(([, left], [, right]) => right.size - left.size)
              .slice(0, 5);
            const languageTotal = topLanguages.reduce((sum, [, language]) => sum + language.size, 0) || 1;
            const height = 196 + topLanguages.length * 30;
            const rows = topLanguages.map(([name, language], index) => {
              const y = 190 + index * 30;
              const percentage = (language.size / languageTotal) * 100;
              return `<circle cx="32" cy="${y - 5}" r="5" fill="${escape(language.color)}"/><text x="48" y="${y}" class="language">${escape(name)}</text><rect x="190" y="${y - 10}" width="450" height="8" rx="4" fill="#e1e4e8"/><rect x="190" y="${y - 10}" width="${(450 * percentage).toFixed(1)}" height="8" rx="4" fill="${escape(language.color)}"/><text x="660" y="${y}" class="percentage">${percentage.toFixed(1)}%</text>`;
            }).join("");
            const updated = new Date().toISOString().replace("T", " ").replace(/\.\d{3}Z$/, " UTC");
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="760" height="${height}" viewBox="0 0 760 ${height}" role="img" aria-label="LimiNode GitHub statistics"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}.title{font-size:24px;font-weight:700}.label{font-size:15px;fill:#57606a}.value{font-size:24px;font-weight:700;fill:#0969da}.section{font-size:17px;font-weight:600}.language{font-size:15px}.percentage{font-size:13px;fill:#57606a;text-anchor:end}.footer{font-size:12px;fill:#57606a}</style><rect width="100%" height="100%" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="28" y="42" class="title">LimiNode — GitHub statistics</text><text x="28" y="78" class="label">Repositories</text><text x="28" y="108" class="value">${formatNumber.format(totalRepositories)}</text><text x="210" y="78" class="label">Stars</text><text x="210" y="108" class="value">${formatNumber.format(stars)}</text><text x="365" y="78" class="label">Forks</text><text x="365" y="108" class="value">${formatNumber.format(forks)}</text><text x="510" y="78" class="label">Watchers</text><text x="510" y="108" class="value">${formatNumber.format(watchers)}</text><text x="640" y="78" class="label">Followers</text><text x="640" y="108" class="value">${formatNumber.format(followers)}</text><line x1="28" x2="732" y1="132" y2="132" stroke="#d0d7de"/><text x="28" y="166" class="section">Most used languages</text>${rows}<text x="28" y="${height - 20}" class="footer">Updated ${updated} · generated from GitHub GraphQL</text></svg>`;
            fs.mkdirSync("/metrics_renders", { recursive: true });
            fs.writeFileSync("/metrics_renders/metrics.svg", svg);
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/metrics_renders
      - uses: actions/deploy-pages@v4
        id: deployment